<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <style>
      text { font-family: "Yu Gothic", "Meiryo", sans-serif; fill: #172033; }
      .title { font-size: 40px; font-weight: 700; }
      .subtitle { font-size: 21px; fill: #4a5568; }
      .plan { font-size: 30px; font-weight: 700; }
      .h2 { font-size: 22px; font-weight: 700; }
      .body { font-size: 19px; }
      .small { font-size: 16px; }
      .tiny { font-size: 14px; }
      .mono { font-family: "Cascadia Mono", "Consolas", monospace; }
      .wire { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#2463eb"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#ea7a19"/>
    </marker>
  </defs>

  <rect width="1600" height="1050" fill="#f5f7fb"/>
  <rect x="40" y="30" width="1520" height="96" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="78" y="79" class="title">CC-02 左右HC-SR04 接続2案</text>
  <text x="78" y="111" class="subtitle">信号割当は共通。違いはセンサー電源をAUX 6Vから取るか、CAN 5Vから取るか。</text>

  <!-- Plan A -->
  <rect x="45" y="155" width="735" height="700" rx="26" fill="#fff" stroke="#2f6f53" stroke-width="4" filter="url(#shadow)"/>
  <rect x="45" y="155" width="735" height="84" rx="26" fill="#2f6f53"/>
  <rect x="45" y="210" width="735" height="29" fill="#2f6f53"/>
  <text x="80" y="207" class="plan" style="fill:#fff">案A　AUX 6V給電</text>
  <rect x="585" y="174" width="160" height="42" rx="21" fill="#d9f7e7"/>
  <text x="617" y="202" class="h2" style="fill:#1f6848">採用案</text>
  <text x="80" y="274" class="h2">配線最小：AUX端子だけで完結</text>
  <text x="80" y="304" class="small">Trigger側ポートのS・＋・－、Echo側ポートのSを使用</text>

  <rect x="78" y="340" width="275" height="280" rx="18" fill="#eef4fb" stroke="#54769e" stroke-width="2"/>
  <text x="105" y="377" class="h2">Pixhawk AUX</text>
  <text x="105" y="407" class="small mono">Trigger側 AUX1 / AUX3</text>
  <rect x="105" y="430" width="220" height="60" rx="10" fill="#dce8ff"/>
  <text x="120" y="467" class="body mono">S　 ＋　 －</text>
  <circle cx="153" cy="520" r="9" fill="#2463eb"/><text x="169" y="526" class="small">Trigger</text>
  <circle cx="153" cy="550" r="9" fill="#e54444"/><text x="169" y="556" class="small">6V</text>
  <circle cx="153" cy="580" r="9" fill="#2e3440"/><text x="169" y="586" class="small">GND</text>
  <text x="105" y="610" class="small mono">Echo側 AUX2 / AUX4：Sのみ</text>

  <rect x="505" y="340" width="240" height="280" rx="18" fill="#f3faf6" stroke="#61947c" stroke-width="2"/>
  <text x="532" y="377" class="h2">HC-SR04</text>
  <circle cx="575" cy="432" r="34" fill="#dce3e6" stroke="#87939b" stroke-width="4"/>
  <circle cx="665" cy="432" r="34" fill="#dce3e6" stroke="#87939b" stroke-width="4"/>
  <text x="535" y="506" class="body" style="fill:#e54444">VCC 6V</text>
  <text x="535" y="540" class="body" style="fill:#2463eb">Trigger</text>
  <text x="535" y="574" class="body" style="fill:#ea7a19">Echo</text>
  <text x="535" y="608" class="body" style="fill:#2e3440">GND</text>

  <path d="M325 454 L420 454 L420 506 L490 506" class="wire" stroke="#e54444" stroke-width="6"/>
  <path d="M325 470 L405 470 L405 608 L490 608" class="wire" stroke="#2e3440" stroke-width="6"/>
  <path d="M325 438 L440 438 L440 540 L490 540" class="wire" stroke="#2463eb" stroke-width="6" marker-end="url(#arr-blue)"/>
  <path d="M490 574 L325 574" class="wire" stroke="#ea7a19" stroke-width="5" marker-end="url(#arr-orange)"/>

  <rect x="78" y="660" width="667" height="152" rx="16" fill="#fff5d8" stroke="#d6a21f" stroke-width="2"/>
  <text x="105" y="698" class="h2" style="fill:#855800">利点</text>
  <text x="105" y="730" class="body">・CAN用JST-GHケーブルと電源分岐が不要</text>
  <text x="105" y="762" class="body">・左右それぞれ隣接するAUX 2ポートへまとめられる</text>
  <text x="105" y="794" class="small" style="fill:#9a3f24">注意：6VはNewVersionの仕様上限5.5Vを超える実験運用</text>

  <!-- Plan B -->
  <rect x="820" y="155" width="735" height="700" rx="26" fill="#fff" stroke="#486b9b" stroke-width="4" filter="url(#shadow)"/>
  <rect x="820" y="155" width="735" height="84" rx="26" fill="#486b9b"/>
  <rect x="820" y="210" width="735" height="29" fill="#486b9b"/>
  <text x="855" y="207" class="plan" style="fill:#fff">案B　CAN 5V給電</text>
  <rect x="1360" y="174" width="160" height="42" rx="21" fill="#e9f0fb"/>
  <text x="1392" y="202" class="h2" style="fill:#375f93">代替案</text>
  <text x="855" y="274" class="h2">仕様内：電源だけCAN1から分岐</text>
  <text x="855" y="304" class="small">AUXはTrigger/Echo信号、CAN1は5V/GNDだけを使用</text>

  <rect x="852" y="340" width="295" height="280" rx="18" fill="#eef4fb" stroke="#54769e" stroke-width="2"/>
  <text x="879" y="377" class="h2">Pixhawk</text>
  <text x="879" y="411" class="small mono">AUX：Trigger / EchoのS</text>
  <circle cx="900" cy="448" r="9" fill="#2463eb"/><text x="918" y="454" class="small">Trigger GPIO</text>
  <circle cx="900" cy="482" r="9" fill="#ea7a19"/><text x="918" y="488" class="small">Echo GPIO</text>
  <text x="879" y="532" class="small mono">CAN1（4ピン）</text>
  <rect x="879" y="548" width="235" height="48" rx="10" fill="#fff"/>
  <circle cx="912" cy="572" r="10" fill="#e54444"/><text x="907" y="578" class="tiny" style="fill:#fff">1</text>
  <circle cx="970" cy="572" r="10" fill="#c7ced8"/><text x="965" y="578" class="tiny">2</text>
  <circle cx="1028" cy="572" r="10" fill="#c7ced8"/><text x="1023" y="578" class="tiny">3</text>
  <circle cx="1086" cy="572" r="10" fill="#2e3440"/><text x="1081" y="578" class="tiny" style="fill:#fff">4</text>
  <text x="885" y="615" class="tiny">1=5V　2/3=未接続　4=GND</text>

  <rect x="1280" y="340" width="240" height="280" rx="18" fill="#f4f7fc" stroke="#7690b5" stroke-width="2"/>
  <text x="1307" y="377" class="h2">HC-SR04</text>
  <circle cx="1350" cy="432" r="34" fill="#dce3e6" stroke="#87939b" stroke-width="4"/>
  <circle cx="1440" cy="432" r="34" fill="#dce3e6" stroke="#87939b" stroke-width="4"/>
  <text x="1310" y="506" class="body" style="fill:#e54444">VCC 5V</text>
  <text x="1310" y="540" class="body" style="fill:#2463eb">Trigger</text>
  <text x="1310" y="574" class="body" style="fill:#ea7a19">Echo</text>
  <text x="1310" y="608" class="body" style="fill:#2e3440">GND</text>

  <path d="M1147 448 L1215 448 L1215 540 L1265 540" class="wire" stroke="#2463eb" stroke-width="6" marker-end="url(#arr-blue)"/>
  <path d="M1265 574 L1105 574 L1105 510 L900 510 L900 492" class="wire" stroke="#ea7a19" stroke-width="5"/>
  <path d="M912 596 L912 625 L1240 625 L1240 506 L1265 506" class="wire" stroke="#e54444" stroke-width="6"/>
  <path d="M1086 596 L1086 645 L1265 645 L1265 608" class="wire" stroke="#2e3440" stroke-width="6"/>

  <rect x="852" y="660" width="668" height="152" rx="16" fill="#edf4ff" stroke="#7194c5" stroke-width="2"/>
  <text x="879" y="698" class="h2" style="fill:#375f93">利点</text>
  <text x="879" y="730" class="body">・NewVersionの3～5.5V電源仕様内</text>
  <text x="879" y="762" class="body">・6Vで不調が出た場合、そのまま切替可能</text>
  <text x="879" y="794" class="small">注意：CAN用4ピンJST-GHケーブルと2台への分岐が必要</text>

  <!-- Common mapping -->
  <rect x="45" y="885" width="1510" height="130" rx="22" fill="#fff" stroke="#8b96a8" stroke-width="2"/>
  <text x="78" y="925" class="h2">両案共通のGPIO割当（同じ配線を左右2台分作る）</text>
  <rect x="78" y="945" width="700" height="48" rx="10" fill="#f2f6fd"/>
  <text x="105" y="976" class="body mono">左：Trigger AUX1/GPIO50　Echo AUX2/GPIO51</text>
  <rect x="822" y="945" width="700" height="48" rx="10" fill="#f6f1fb"/>
  <text x="849" y="976" class="body mono">右：Trigger AUX3/GPIO52　Echo AUX4/GPIO53</text>
</svg>
