<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <style>
      text { font-family: "Yu Gothic", "Meiryo", sans-serif; fill: #172033; }
      .title { font-size: 42px; font-weight: 700; }
      .subtitle { font-size: 22px; fill: #4a5568; }
      .h1 { font-size: 28px; font-weight: 700; }
      .h2 { font-size: 22px; font-weight: 700; }
      .body { font-size: 20px; }
      .small { font-size: 17px; }
      .tiny { font-size: 15px; }
      .mono { font-family: "Cascadia Mono", "Consolas", monospace; }
      .wire { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2463eb"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea7a19"/>
    </marker>
  </defs>

  <rect width="1600" height="1050" fill="#f5f7fb"/>
  <rect x="42" y="34" width="1516" height="92" rx="20" fill="#ffffff" filter="url(#shadow)"/>
  <text x="80" y="84" class="title">CC-02 左右HC-SR04 GPIO接続図</text>
  <text x="80" y="113" class="subtitle">Pixhawk 6C Mini Model A Current／前方TF-Luna（RNGFND1）はそのまま</text>

  <!-- Pixhawk -->
  <rect x="70" y="165" width="565" height="675" rx="26" fill="#ffffff" stroke="#2b4365" stroke-width="3" filter="url(#shadow)"/>
  <rect x="70" y="165" width="565" height="72" rx="26" fill="#243b5a"/>
  <rect x="70" y="211" width="565" height="26" fill="#243b5a"/>
  <text x="105" y="211" class="h1" style="fill:#ffffff">Pixhawk 6C Mini</text>
  <text x="465" y="210" class="small" style="fill:#dce8f7">ArduRover 4.6.3</text>

  <!-- CAN connector -->
  <rect x="105" y="275" width="495" height="192" rx="18" fill="#eef4fb" stroke="#5a789d" stroke-width="2"/>
  <text x="130" y="310" class="h2">CAN1（JST-GH 1.25 mm / 4P）</text>
  <text x="130" y="340" class="small">未使用ポートから5V/GNDだけを利用</text>
  <rect x="130" y="365" width="438" height="70" rx="12" fill="#ffffff" stroke="#a9b8ca"/>
  <circle cx="175" cy="400" r="17" fill="#e54444"/><text x="169" y="406" class="tiny" style="fill:#fff;font-weight:700">1</text>
  <circle cx="275" cy="400" r="17" fill="#c7ced8"/><text x="269" y="406" class="tiny" style="font-weight:700">2</text>
  <circle cx="375" cy="400" r="17" fill="#c7ced8"/><text x="369" y="406" class="tiny" style="font-weight:700">3</text>
  <circle cx="475" cy="400" r="17" fill="#2e3440"/><text x="469" y="406" class="tiny" style="fill:#fff;font-weight:700">4</text>
  <text x="145" y="455" class="tiny">+5V</text>
  <text x="241" y="455" class="tiny">CAN_H</text>
  <text x="341" y="455" class="tiny">CAN_L</text>
  <text x="454" y="455" class="tiny">GND</text>

  <!-- AUX pins -->
  <rect x="105" y="500" width="495" height="278" rx="18" fill="#eef4fb" stroke="#5a789d" stroke-width="2"/>
  <text x="130" y="538" class="h2">AUX信号端子（FMU出力）</text>
  <text x="130" y="566" class="small">各SERVOx_FUNCTION=-1でGPIO化</text>

  <rect x="130" y="590" width="438" height="43" rx="9" fill="#dce8ff"/>
  <text x="150" y="618" class="body mono">AUX1 / SERVO9  / GPIO50</text>
  <circle cx="548" cy="611" r="9" fill="#2463eb"/>
  <rect x="130" y="642" width="438" height="43" rx="9" fill="#fff0dc"/>
  <text x="150" y="670" class="body mono">AUX2 / SERVO10 / GPIO51</text>
  <circle cx="548" cy="663" r="9" fill="#ea7a19"/>
  <rect x="130" y="694" width="438" height="43" rx="9" fill="#dce8ff"/>
  <text x="150" y="722" class="body mono">AUX3 / SERVO11 / GPIO52</text>
  <circle cx="548" cy="715" r="9" fill="#2463eb"/>
  <rect x="130" y="746" width="438" height="43" rx="9" fill="#fff0dc"/>
  <text x="150" y="774" class="body mono">AUX4 / SERVO12 / GPIO53</text>
  <circle cx="548" cy="767" r="9" fill="#ea7a19"/>
  <text x="130" y="808" class="tiny" style="fill:#c2410c;font-weight:700">AUX＋/MAIN＋ = VDD_SERVO 公称6V（WP-1060 BEC）</text>
  <text x="130" y="829" class="tiny" style="fill:#c2410c">HC-SR04上限5.5Vを超えるため電源には使用しない</text>

  <!-- Sensor left -->
  <rect x="960" y="165" width="570" height="303" rx="26" fill="#ffffff" stroke="#39705c" stroke-width="3" filter="url(#shadow)"/>
  <rect x="960" y="165" width="570" height="70" rx="26" fill="#39705c"/>
  <rect x="960" y="209" width="570" height="26" fill="#39705c"/>
  <text x="995" y="210" class="h1" style="fill:#ffffff">左 HC-SR04 NewVersion</text>
  <text x="995" y="266" class="small">GPIOモード：R4=NC、R5=NC（出荷時）</text>
  <circle cx="1055" cy="327" r="53" fill="#dfe6e9" stroke="#87939b" stroke-width="5"/>
  <circle cx="1055" cy="327" r="35" fill="#9ca8af"/>
  <circle cx="1185" cy="327" r="53" fill="#dfe6e9" stroke="#87939b" stroke-width="5"/>
  <circle cx="1185" cy="327" r="35" fill="#9ca8af"/>
  <rect x="1284" y="262" width="214" height="168" rx="14" fill="#f4faf7" stroke="#9ebbad"/>
  <text x="1305" y="294" class="small">端子</text>
  <text x="1305" y="326" class="body" style="fill:#e54444">VCC</text>
  <text x="1305" y="358" class="body" style="fill:#2463eb">Trigger</text>
  <text x="1305" y="390" class="body" style="fill:#ea7a19">Echo</text>
  <text x="1305" y="422" class="body" style="fill:#2e3440">GND</text>
  <text x="1422" y="326" class="small mono">5V</text>
  <text x="1400" y="358" class="small mono">GPIO50</text>
  <text x="1400" y="390" class="small mono">GPIO51</text>
  <text x="1420" y="422" class="small mono">GND</text>
  <text x="995" y="445" class="h2">RNGFND2 / ORIENT=6（Left）</text>

  <!-- Sensor right -->
  <rect x="960" y="505" width="570" height="303" rx="26" fill="#ffffff" stroke="#6f4c8c" stroke-width="3" filter="url(#shadow)"/>
  <rect x="960" y="505" width="570" height="70" rx="26" fill="#6f4c8c"/>
  <rect x="960" y="549" width="570" height="26" fill="#6f4c8c"/>
  <text x="995" y="550" class="h1" style="fill:#ffffff">右 HC-SR04 NewVersion</text>
  <text x="995" y="606" class="small">GPIOモード：R4=NC、R5=NC（出荷時）</text>
  <circle cx="1055" cy="667" r="53" fill="#dfe6e9" stroke="#87939b" stroke-width="5"/>
  <circle cx="1055" cy="667" r="35" fill="#9ca8af"/>
  <circle cx="1185" cy="667" r="53" fill="#dfe6e9" stroke="#87939b" stroke-width="5"/>
  <circle cx="1185" cy="667" r="35" fill="#9ca8af"/>
  <rect x="1284" y="602" width="214" height="168" rx="14" fill="#faf7fc" stroke="#beaacf"/>
  <text x="1305" y="634" class="small">端子</text>
  <text x="1305" y="666" class="body" style="fill:#e54444">VCC</text>
  <text x="1305" y="698" class="body" style="fill:#2463eb">Trigger</text>
  <text x="1305" y="730" class="body" style="fill:#ea7a19">Echo</text>
  <text x="1305" y="762" class="body" style="fill:#2e3440">GND</text>
  <text x="1422" y="666" class="small mono">5V</text>
  <text x="1400" y="698" class="small mono">GPIO52</text>
  <text x="1400" y="730" class="small mono">GPIO53</text>
  <text x="1420" y="762" class="small mono">GND</text>
  <text x="995" y="785" class="h2">RNGFND3 / ORIENT=2（Right）</text>

  <!-- Wires: power buses -->
  <path d="M 245 365 L 245 255 L 720 255 L 720 312 L 925 312" class="wire" stroke="#e54444" stroke-width="7"/>
  <path d="M 720 312 L 720 652 L 925 652" class="wire" stroke="#e54444" stroke-width="7"/>
  <circle cx="720" cy="312" r="7" fill="#e54444"/>
  <text x="735" y="300" class="small" style="fill:#e54444;font-weight:700">+5Vを2台へ分岐</text>
  <path d="M 545 365 L 545 478 L 750 478 L 750 412 L 925 412" class="wire" stroke="#2e3440" stroke-width="7"/>
  <path d="M 750 412 L 750 752 L 925 752" class="wire" stroke="#2e3440" stroke-width="7"/>
  <circle cx="750" cy="412" r="7" fill="#2e3440"/>

  <!-- Wires: GPIO -->
  <path d="M 557 611 L 690 611 L 690 352 L 925 352" class="wire" stroke="#2463eb" stroke-width="6" marker-end="url(#arrow-blue)"/>
  <path d="M 925 390 L 680 390 L 680 663 L 557 663" class="wire" stroke="#ea7a19" stroke-width="6" marker-end="url(#arrow-orange)"/>
  <path d="M 557 715 L 820 715 L 820 692 L 925 692" class="wire" stroke="#2463eb" stroke-width="6" marker-end="url(#arrow-blue)"/>
  <path d="M 925 730 L 850 730 L 850 790 L 650 790 L 650 767 L 557 767" class="wire" stroke="#ea7a19" stroke-width="6" marker-end="url(#arrow-orange)"/>

  <!-- Unused CAN lines -->
  <path d="M 345 365 L 345 345" class="wire" stroke="#9aa4b2" stroke-width="5" stroke-dasharray="8 7"/>
  <path d="M 445 365 L 445 345" class="wire" stroke="#9aa4b2" stroke-width="5" stroke-dasharray="8 7"/>
  <line x1="329" y1="334" x2="361" y2="354" stroke="#d64545" stroke-width="5"/>
  <line x1="361" y1="334" x2="329" y2="354" stroke="#d64545" stroke-width="5"/>
  <line x1="429" y1="334" x2="461" y2="354" stroke="#d64545" stroke-width="5"/>
  <line x1="461" y1="334" x2="429" y2="354" stroke="#d64545" stroke-width="5"/>
  <text x="300" y="326" class="tiny" style="fill:#d64545;font-weight:700">未接続・個別絶縁</text>

  <!-- Legend -->
  <rect x="70" y="870" width="1460" height="142" rx="22" fill="#fff8e8" stroke="#d9a62e" stroke-width="3"/>
  <text x="100" y="908" class="h2" style="fill:#8a5a00">直結前の必須確認</text>
  <text x="100" y="943" class="body">5V給電時のEcho HIGH電圧を測定し、3.3V以下を確認してからAUXへ接続する。</text>
  <text x="100" y="975" class="body">AUX＋は公称6Vのため不使用。HC-SR04電源はCANの5Vを使用（未使用ならCAN2も同じ配列）。</text>
  <circle cx="1025" cy="906" r="8" fill="#2463eb"/><text x="1043" y="913" class="small">Trigger（Pixhawk → センサー）</text>
  <circle cx="1025" cy="944" r="8" fill="#ea7a19"/><text x="1043" y="951" class="small">Echo（センサー → Pixhawk）</text>
  <circle cx="1025" cy="982" r="8" fill="#e54444"/><text x="1043" y="989" class="small">5V</text>
  <circle cx="1220" cy="982" r="8" fill="#2e3440"/><text x="1238" y="989" class="small">GND</text>
</svg>
