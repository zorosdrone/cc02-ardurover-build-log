<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
<rect width="1600" height="1180" fill="#f4f7fb"/>
<text x="45" y="30" font-family="Meiryo,sans-serif" font-size="36" fill="#142b43" dominant-baseline="text-before-edge">02  ケーブル製作・端子対応図</text>
<text x="45" y="85" font-family="Meiryo,sans-serif" font-size="20" fill="#536170" dominant-baseline="text-before-edge">番号は公式ポート定義。挿し込み面と線側では左右が反転するため、現物のPin1と導通を確認してから製作。</text>
<rect x="45" y="135" width="1510" height="350" rx="12" fill="#ffffff" stroke="#c9d4e0" stroke-width="2"/>
<text x="65" y="150" font-family="Meiryo,sans-serif" font-size="28" fill="#142b43" dominant-baseline="text-before-edge">A  Raspberry Pi — 3本だけ接続</text>
<text x="70" y="200" font-family="Meiryo,sans-serif" font-size="21" fill="#142b43" dominant-baseline="text-before-edge">FC：TELEM1 / JST-GH 6P</text>
<text x="925" y="200" font-family="Meiryo,sans-serif" font-size="21" fill="#142b43" dominant-baseline="text-before-edge">Pi：40ピンGPIO（物理番号）</text>
<text x="70" y="245" font-family="Meiryo,sans-serif" font-size="21" fill="#142b43" dominant-baseline="text-before-edge">Pin2  TX（送信）</text>
<text x="925" y="245" font-family="Meiryo,sans-serif" font-size="21" fill="#142b43" dominant-baseline="text-before-edge">物理10 / GPIO15 / RX（受信）</text>
<path d="M600 258 L895 258" stroke="#1769aa" fill="none" stroke-width="3"/>
<polygon points="895,258 884.1946347717678,263.21958640933474 884.1946347717678,252.78041359066523" fill="#1769aa"/>
<text x="70" y="285" font-family="Meiryo,sans-serif" font-size="21" fill="#142b43" dominant-baseline="text-before-edge">Pin3  RX（受信）</text>
<text x="925" y="285" font-family="Meiryo,sans-serif" font-size="21" fill="#142b43" dominant-baseline="text-before-edge">物理8 / GPIO14 / TX（送信）</text>
<path d="M895 298 L600 298" stroke="#1769aa" fill="none" stroke-width="3"/>
<polygon points="600,298 610.8053652282322,292.78041359066526 610.8053652282322,303.21958640933474" fill="#1769aa"/>
<text x="70" y="325" font-family="Meiryo,sans-serif" font-size="21" fill="#142b43" dominant-baseline="text-before-edge">Pin6  GND</text>
<text x="925" y="325" font-family="Meiryo,sans-serif" font-size="21" fill="#142b43" dominant-baseline="text-before-edge">物理6 / GND</text>
<path d="M600 338 L895 338" stroke="#536170" fill="none" stroke-width="3"/>
<text x="70" y="413" font-family="Meiryo,sans-serif" font-size="19" fill="#9b6100" dominant-baseline="text-before-edge">TELEM1 Pin1（5V）・Pin4（CTS）・Pin5（RTS）は未接続。各線を別々に絶縁。</text>
<text x="70" y="442" font-family="Meiryo,sans-serif" font-size="19" fill="#9b6100" dominant-baseline="text-before-edge">別積みモバイルバッテリー → Pi電源入力。C25は旧部品表の記録で現物型番未確認。UARTは3.3V。</text>
<rect x="45" y="505" width="1510" height="350" rx="12" fill="#ffffff" stroke="#c9d4e0" stroke-width="2"/>
<text x="65" y="520" font-family="Meiryo,sans-serif" font-size="28" fill="#142b43" dominant-baseline="text-before-edge">B  TF-Luna — 4本接続 / UARTモード</text>
<text x="70" y="570" font-family="Meiryo,sans-serif" font-size="21" fill="#142b43" dominant-baseline="text-before-edge">FC：TELEM2 / JST-GH 6P</text>
<text x="925" y="570" font-family="Meiryo,sans-serif" font-size="21" fill="#142b43" dominant-baseline="text-before-edge">TF-Luna：番号・今回の現物色</text>
<text x="70" y="615" font-family="Meiryo,sans-serif" font-size="21" fill="#142b43" dominant-baseline="text-before-edge">Pin1  +5V</text>
<text x="925" y="615" font-family="Meiryo,sans-serif" font-size="21" fill="#142b43" dominant-baseline="text-before-edge">No.1  赤 / +5V</text>
<path d="M600 628 L895 628" stroke="#c33435" fill="none" stroke-width="3"/>
<polygon points="895,628 884.1946347717678,633.2195864093347 884.1946347717678,622.7804135906653" fill="#c33435"/>
<text x="70" y="655" font-family="Meiryo,sans-serif" font-size="21" fill="#142b43" dominant-baseline="text-before-edge">Pin2  TX（送信）</text>
<text x="925" y="655" font-family="Meiryo,sans-serif" font-size="21" fill="#142b43" dominant-baseline="text-before-edge">No.2  青 / RXD（受信）</text>
<path d="M600 668 L895 668" stroke="#1769aa" fill="none" stroke-width="3"/>
<polygon points="895,668 884.1946347717678,673.2195864093347 884.1946347717678,662.7804135906653" fill="#1769aa"/>
<text x="70" y="695" font-family="Meiryo,sans-serif" font-size="21" fill="#142b43" dominant-baseline="text-before-edge">Pin3  RX（受信）</text>
<text x="925" y="695" font-family="Meiryo,sans-serif" font-size="21" fill="#142b43" dominant-baseline="text-before-edge">No.3  黄 / TXD（送信）</text>
<path d="M895 708 L600 708" stroke="#1769aa" fill="none" stroke-width="3"/>
<polygon points="600,708 610.8053652282322,702.7804135906653 610.8053652282322,713.2195864093347" fill="#1769aa"/>
<text x="70" y="735" font-family="Meiryo,sans-serif" font-size="21" fill="#142b43" dominant-baseline="text-before-edge">Pin6  GND</text>
<text x="925" y="735" font-family="Meiryo,sans-serif" font-size="21" fill="#142b43" dominant-baseline="text-before-edge">No.4  緑 / GND</text>
<path d="M600 748 L895 748" stroke="#536170" fill="none" stroke-width="3"/>
<text x="70" y="783" font-family="Meiryo,sans-serif" font-size="19" fill="#9b6100" dominant-baseline="text-before-edge">FC Pin4・5は未接続。TF-Luna No.5（白）・No.6（黒）も未接続にして個別絶縁。</text>
<text x="70" y="812" font-family="Meiryo,sans-serif" font-size="19" fill="#9b6100" dominant-baseline="text-before-edge">白をGNDにつなぐとI2Cモードになる。今回の黒線はGNDではない。色より番号と導通を優先。</text>
<rect x="45" y="875" width="1510" height="225" rx="12" fill="#ffffff" stroke="#c9d4e0" stroke-width="2"/>
<text x="65" y="890" font-family="Meiryo,sans-serif" font-size="28" fill="#142b43" dominant-baseline="text-before-edge">C  3線コネクタと任意のOLED</text>
<text x="70" y="939" font-family="Meiryo,sans-serif" font-size="22" fill="#142b43" dominant-baseline="text-before-edge">RC IN：S ← R8EF S.BUS / CH1信号、+ → 受信機電源、− ↔ GND</text>
<text x="70" y="980" font-family="Meiryo,sans-serif" font-size="22" fill="#142b43" dominant-baseline="text-before-edge">MAIN 1 / 3：S → サーボ / ESC信号、+ ↔ サーボ電源、− ↔ GND（上下は実機印字で確認）</text>
<text x="70" y="1021" font-family="Meiryo,sans-serif" font-size="22" fill="#142b43" dominant-baseline="text-before-edge">I2C → OLED：Pin1 +5V → VCC、Pin2 SCL → SCL、Pin3 SDA → SDA、Pin4 GND → GND</text>
<text x="70" y="1060" font-family="Meiryo,sans-serif" font-size="19" fill="#536170" dominant-baseline="text-before-edge">TX＝送信、RX＝受信、GND＝共通の基準。線の交差ではなく、端子の役割で接続を追う。</text>
<text x="45" y="1135" font-family="Meiryo,sans-serif" font-size="18" fill="#536170" dominant-baseline="text-before-edge">2026-09-05 作成｜換装・動作確認済み機体の配線記録｜端子の物理配置・縮尺を示す図ではありません</text>
</svg>